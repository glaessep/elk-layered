[package]
name = "elk-layered"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "EPL-2.0"
description = "Eclipse ELK's layered layout algorithm in Rust, ported from ELK's Java and checked against elkjs 0.9.3."
repository = "https://github.com/glaessep/elk-layered"
readme = "README.md"
keywords = ["elk", "layout", "layered", "graph", "diagrams"]
categories = ["visualization"]

[dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
# Reads and writes the graph types as elkjs's JSON.
serde = ["dep:serde"]

[dev-dependencies]
# `float_roundtrip` reads every number to the nearest double, as JavaScript does. Without it,
# serde_json may read 127.58333333333333 one bit off, and the parity test would see a layout
# difference that is not there. A caller who parses JSON needs the same feature: README.md says so.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[[test]]
name = "elkjs_parity"
required-features = ["serde"]

[[test]]
name = "json"
required-features = ["serde"]
